
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      overflow: hidden;
      transition: background 0.5s;
    }
    h1 {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .controls {
      position: fixed;
      bottom: 40px;
      width: 100%;
      z-index: 2;
    }
    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #6750d8;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #4935a9; }
  </style>
</head>
<body>
  <h1 id="hello">Hello World! 👋</h1>
  <div class="controls">
    <button onclick="changeColor()">🎨 Change Colour</button>
    <button onclick="toggleBounce()">🚀 Start Bouncing</button>
  </div>

  <script>
    const hello = document.getElementById("hello");
    let bouncing = false, x = 100, y = 100, dx = 3, dy = 3;

    function changeColor() {
      const colors = ["#ffd6e0", "#d6f5ff", "#e4ffd6",
                      "#fff0b3", "#e9d6ff"];
      document.body.style.background =
        colors[Math.floor(Math.random() * colors.length)];
    }

    function toggleBounce() {
      bouncing = !bouncing;
      event.target.textContent = bouncing
        ? "⏸ Stop Bouncing" : "🚀 Start Bouncing";
      if (bouncing) {
        hello.style.transform = "none";
        animate();
      }
    }

    function animate() {
      if (!bouncing) return;
      x += dx; y += dy;
      if (x <= 0 || x + hello.offsetWidth >= innerWidth) dx *= -1;
      if (y <= 0 || y + hello.offsetHeight >= innerHeight) dy *= -1;
      x = Math.max(0, Math.min(x, innerWidth - hello.offsetWidth));
      y = Math.max(0, Math.min(y, innerHeight - hello.offsetHeight));
      hello.style.left = x + "px";
      hello.style.top = y + "px";
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
