
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON INVADERS</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#090719;
  color:#fff;font-family:'Courier New',monospace;
  display:flex;align-items:center;justify-content:center;
}
.arcade{width:min(96vw,560px);text-align:center}
h1{
  color:#ff49b6;font-size:clamp(25px,6vw,42px);
  text-shadow:0 0 12px #ff49b6;
  letter-spacing:4px;margin:12px 0;
}
.subtitle{color:#49fce5;font-size:12px;letter-spacing:3px}
.hud{display:flex;justify-content:space-between;
  margin:18px 0 10px;color:#49fce5;font-size:14px}
canvas{
  width:100%;background:#100e29;
  border:3px solid #ff49b6;
  box-shadow:0 0 25px #ff49b644;
  image-rendering:pixelated;display:block;
}
button{
  background:#ff49b6;color:#100e29;border:0;
  font:bold 15px 'Courier New';padding:13px 22px;
  cursor:pointer;box-shadow:4px 4px #49fce5;
  margin:15px 5px;touch-action:none;
}
button:hover{background:#49fce5;box-shadow:4px 4px #ff49b6}
.controls{color:#a6a0c9;font-size:12px;margin:12px}
.touch{display:flex;justify-content:center;gap:12px}
.touch button{min-width:65px}
</style>
</head>
<body>
<div class="arcade">
  <div class="subtitle">★ INSERT COIN ★</div>
  <h1>NEON INVADERS</h1>
  <div class="hud">
    <span>SCORE: <b id="score">0000</b></span>
    <span>LEVEL: <b id="level">1</b></span>
    <span>LIVES: <b id="lives">♥♥♥</b></span>
  </div>
  <canvas id="game" width="500" height="540"></canvas>
  <button id="start">START GAME</button>
  <div class="controls">← → / A D TO MOVE • SPACE TO FIRE</div>
  <div class="touch">
    <button id="left">◀</button>
    <button id="fire">FIRE</button>
    <button id="right">▶</button>
  </div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=500,H=540;
let player,bullets=[],enemies=[],particles=[],stars=[];
let score=0,level=1,lives=3,active=false;
let keys={},frame=0,enemyDir=1,lastShot=0;
let audio;

function beep(freq=440,duration=.07,type="square"){
  try{
    audio??=new (window.AudioContext||window.webkitAudioContext)();
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(.035,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);gain.connect(audio.destination);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}
function reset(){
  score=0;level=1;lives=3;frame=0;
  bullets=[];particles=[];active=true;
  player={x:250,y:492,w:34,h:22};
  spawnWave();updateHud();
  $("start").textContent="RESTART";
}
function spawnWave(){
  enemies=[];enemyDir=1;
  for(let r=0;r<4;r++)
    for(let c=0;c<8;c++)
      enemies.push({
        x:53+c*51,y:65+r*42,w:27,h:23,
        color:["#49fce5","#ff49b6","#ffe56c","#aa80ff"][r],
        alive:true
      });
}
function updateHud(){
  $("score").textContent=String(score).padStart(4,"0");
  $("level").textContent=level;
  $("lives").textContent="♥".repeat(Math.max(0,lives));
}
function burst(x,y,color){
  for(let i=0;i<12;i++)
    particles.push({x,y,vx:(Math.random()-.5)*6,
      vy:(Math.random()-.5)*6,life:25,color});
}
function shoot(){
  if(!active||frame-lastShot<11)return;
  bullets.push({x:player.x,y:player.y-15});
  lastShot=frame;beep(660,.045);
}
function hit(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&
         a.y<b.y+b.h&&a.y+a.h>b.y;
}
function endGame(){
  active=false;beep(110,.4,"sawtooth");
  $("start").textContent="PLAY AGAIN";
}
function update(){
  frame++;
  if(!active)return;
  if(keys.ArrowLeft||keys.a)player.x-=5;
  if(keys.ArrowRight||keys.d)player.x+=5;
  player.x=Math.max(18,Math.min(W-18,player.x));
  if(keys[" "])shoot();

  bullets.forEach(b=>b.y-=9);
  bullets=bullets.filter(b=>b.y>-20);

  const alive=enemies.filter(e=>e.alive);
  if(frame%Math.max(5,25-level*2)===0){
    let reverse=false;
    alive.forEach(e=>{
      if(e.x+enemyDir*(7+level)>W-30||
         e.x+enemyDir*(7+level)<20)reverse=true;
    });
    if(reverse){
      enemyDir*=-1;
      alive.forEach(e=>e.y+=13);
    }else alive.forEach(e=>e.x+=enemyDir*(7+level));
  }

  for(const b of bullets){
    for(const e of enemies){
      if(e.alive&&hit({x:b.x-2,y:b.y,w:4,h:12},e)){
        e.alive=false;b.y=-100;score+=10;
        burst(e.x+13,e.y+11,e.color);
        beep(180+Math.random()*250,.09);
        updateHud();break;
      }
    }
  }
  if(alive.some(e=>e.y+e.h>=player.y)){
    lives--;updateHud();
    burst(player.x,player.y,"#ff49b6");
    if(lives<=0){endGame();return;}
    spawnWave();
  }
  if(enemies.every(e=>!e.alive)){
    level++;updateHud();spawnWave();
    beep(880,.2,"triangle");
  }
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
  });
  particles=particles.filter(p=>p.life>0);
}
function pixel(x,y,color,size=4){
  ctx.fillStyle=color;ctx.fillRect(x,y,size,size);
}
function drawShip(){
  const x=player.x,y=player.y;
  ctx.fillStyle="#49fce5";
  ctx.fillRect(x-16,y+5,32,15);
  ctx.fillRect(x-10,y,20,7);
  ctx.fillRect(x-4,y-9,8,13);
  ctx.fillStyle="#fff";ctx.fillRect(x-3,y-5,6,6);
  ctx.fillStyle="#ff49b6";
  ctx.fillRect(x-10,y+20,6,5+Math.random()*8);
  ctx.fillRect(x+4,y+20,6,5+Math.random()*8);
}
function drawEnemy(e){
  const x=e.x,y=e.y;
  ctx.fillStyle=e.color;
  ctx.fillRect(x+5,y,17,5);
  ctx.fillRect(x,y+5,27,13);
  ctx.fillRect(x+4,y+18,6,5);
  ctx.fillRect(x+17,y+18,6,5);
  ctx.fillStyle="#100e29";
  ctx.fillRect(x+6,y+9,5,5);
  ctx.fillRect(x+17,y+9,5,5);
}
function draw(){
  ctx.fillStyle="#100e29";ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    s.y=(s.y+s.speed)%H;
    ctx.fillStyle="#625b91";
    ctx.fillRect(s.x,s.y,s.size,s.size);
  });
  ctx.fillStyle="#ffffff08";
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);

  if(active){
    drawShip();
    enemies.filter(e=>e.alive).forEach(drawEnemy);
    ctx.fillStyle="#ffe56c";
    bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,13));
  }
  particles.forEach(p=>pixel(p.x,p.y,p.color,4));

  if(!active){
    ctx.textAlign="center";
    ctx.fillStyle="#ff49b6";
    ctx.font="bold 34px Courier New";
    ctx.fillText(lives<=0?"GAME OVER":"READY PLAYER ONE",250,235);
    ctx.fillStyle="#49fce5";
    ctx.font="15px Courier New";
    ctx.fillText(lives<=0?"FINAL SCORE: "+score:"DEFEND THE GALAXY!",250,275);
    ctx.fillText("PRESS START TO PLAY",250,315);
  }
}
function loop(){
  update();draw();requestAnimationFrame(loop);
}
stars=Array.from({length:65},()=>({
  x:Math.random()*W,y:Math.random()*H,
  size:Math.random()>0.8?2:1,
  speed:.2+Math.random()*.7
}));
$("start").onclick=reset;
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  keys[e.key]=true;
  if(e.key==="Enter"&&!active)reset();
});
window.addEventListener("keyup",e=>keys[e.key]=false);
window.addEventListener("blur",()=>keys={});
function bind(id,key){
  const el=$(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();keys[key]=true;
    el.setPointerCapture(e.pointerId);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(type=>
    el.addEventListener(type,()=>keys[key]=false));
}
bind("left","ArrowLeft");
bind("right","ArrowRight");
bind("fire"," ");
loop();
</script>
</body>
</html>
