<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pink Pixel Maze</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#371347,#090615 70%);color:#fff;font-family:'Courier New',monospace;display:flex;justify-content:center;align-items:center;padding:20px}.shell{width:min(95vw,610px);text-align:center}h1{font-size:clamp(25px,6vw,43px);letter-spacing:3px;color:#ff6bd6;text-shadow:0 0 9px #ff3caf,0 0 26px #ff3caf;margin:8px 0}.sub{font-size:12px;color:#67fff1;letter-spacing:3px}.hud{display:flex;justify-content:space-between;gap:6px;margin:18px 0 10px;color:#8ffff1;font-weight:bold;font-size:clamp(11px,2.6vw,15px)}canvas{display:block;width:100%;max-width:560px;margin:auto;background:#100b26;border:3px solid #ff51c8;box-shadow:0 0 22px #ff51c866;image-rendering:pixelated;border-radius:7px}button{font:700 14px 'Courier New',monospace;border:2px solid #ff6bd6;background:#28123b;color:#fff;padding:12px 20px;cursor:pointer;box-shadow:0 0 12px #ff6bd666;touch-action:none}button:hover{background:#752263}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:7px;justify-content:center;margin:13px auto}.controls button{padding:12px 0;font-size:20px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.note{color:#b8a5d4;font-size:12px;margin:10px 0 0}#start{margin-top:15px;background:#ff53bf;color:#200a2b;border-color:#ff9de5}#start:hover{background:#ff9de5}</style></head><body><main class="shell"><div class="sub">✦ 1980s ARCADE DREAM ✦</div><h1>💗 PINK PIXEL MAZE</h1><div class="hud"><span>SCORE <b id="score">0000</b></span><span>LEVEL <b id="level">1</b></span><span>LIVES <b id="lives">♥♥♥</b></span><span>BEST <b id="best">0000</b></span></div><canvas id="game" width="504" height="504" aria-label="Neon maze game"></canvas><button id="start">START GAME</button><div class="controls"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><p class="note">ARROW KEYS / WASD • EAT DOTS • GRAB GLOWING HEARTS TO CHASE GHOSTS!</p></main><script>
const raw=[
'#####################',
'#.........#.........#',
'#.###.###.#.###.###.#',
'#o###.###.#.###.###o#',
'#...................#',
'#.###.#.#####.#.###.#',
'#.....#...#...#.....#',
'#####.### # ###.#####',
'    #.#       #.#    ',
'#####.# ## ## #.#####',
'     .  #   #  .     ',
'#####.# ##### #.#####',
'    #.#       #.#    ',
'#####.# ##### #.#####',
'#.........#.........#',
'#.###.###.#.###.###.#',
'#o..#..... .....#..o#',
'###.#.#.#####.#.#.###',
'#.....#...#...#.....#',
'#.#######.#.#######.#',
'#...................#',
'#####################'];
// 21 columns x 22 rows, tile size 24. Extra canvas height holds the bottom row.
const C=document.getElementById('game'),ctx=C.getContext('2d'),T=24,ROWS=raw.length,COLS=21;
C.height=ROWS*T;const el=id=>document.getElementById(id);
const dirs={left:{x:-1,y:0,a:Math.PI},right:{x:1,y:0,a:0},up:{x:0,y:-1,a:-Math.PI/2},down:{x:0,y:1,a:Math.PI/2}};
let map,player,ghosts,score=0,best=0,lives=3,level=1,playing=false,over=false,won=false,power=0,tick=0,desired='left',last=0,acc=0,freeze=0,ctxAudio;
try{best=Number(localStorage.getItem('pinkMazeBest'))||0}catch(e){}
function sound(f=450,d=.07){try{ctxAudio??=new(window.AudioContext||window.webkitAudioContext)();const o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.type='sine';o.frequency.setValueAtTime(f,ctxAudio.currentTime);g.gain.setValueAtTime(.025,ctxAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+d);o.connect(g);g.connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+d)}catch(e){}}
function setHud(){el('score').textContent=String(score).padStart(4,'0');el('best').textContent=String(best).padStart(4,'0');el('level').textContent=level;el('lives').textContent='♥'.repeat(lives)}
function resetActors(){player={x:10,y:16,dir:'left'};desired='left';ghosts=[{x:9,y:10,dir:'left',color:'#67fff1',home:[9,10]},{x:10,y:10,dir:'right',color:'#ffad59',home:[10,10]},{x:11,y:10,dir:'up',color:'#ae8aff',home:[11,10]}];freeze=9}
function makeMap(){map=raw.map(r=>r.split(''));for(const [x,y] of [[10,16],[9,10],[10,10],[11,10]])if(map[y][x]!=='#')map[y][x]=' '}
function start(){score=0;level=1;lives=3;power=0;tick=0;over=false;won=false;playing=true;makeMap();resetActors();setHud();el('start').textContent='RESTART GAME';sound(660,.13)}
function valid(x,y){return y>=0&&y<ROWS&&x>=0&&x<COLS&&map[y][x]!=='#'}
function move(e,dir){const d=dirs[dir];if(valid(e.x+d.x,e.y+d.y)){e.x+=d.x;e.y+=d.y;e.dir=dir;return true}return false}
function remaining(){return map.some(row=>row.some(c=>c==='.'||c==='o'))}
function collision(){for(const g of ghosts){if(g.x!==player.x||g.y!==player.y)continue;if(power>0){score+=200;g.x=g.home[0];g.y=g.home[1];sound(900,.14)}else{lives--;power=0;sound(140,.32);if(lives<=0){playing=false;over=true;el('start').textContent='PLAY AGAIN'}else resetActors()}setHud();return true}return false}
function step(){if(!playing)return;tick++;if(freeze>0){freeze--;return}if(valid(player.x+dirs[desired].x,player.y+dirs[desired].y))player.dir=desired;move(player,player.dir);const c=map[player.y][player.x];if(c==='.'||c==='o'){score+=c==='o'?50:10;if(c==='o'){power=58;sound(880,.18)}else if(tick%2===0)sound(440,.025);map[player.y][player.x]=' ';if(score>best){best=score;try{localStorage.setItem('pinkMazeBest',best)}catch(e){}}setHud()}
if(!remaining()){level++;makeMap();resetActors();power=0;setHud();sound(1100,.3);return}
if(collision())return;
if(tick%2===0){for(const g of ghosts){const opts=Object.keys(dirs).filter(d=>valid(g.x+dirs[d].x,g.y+dirs[d].y));if(!opts.length)continue;const reverse={left:'right',right:'left',up:'down',down:'up'}[g.dir];const choices=opts.filter(d=>d!==reverse);const pool=choices.length?choices:opts;let choice;if(Math.random()<(power?0.35:0.65)){const target=power?{x:COLS-1-player.x,y:ROWS-1-player.y}:player;choice=pool.slice().sort((a,b)=>{const da=dirs[a],db=dirs[b];return (Math.abs(g.x+da.x-target.x)+Math.abs(g.y+da.y-target.y))-(Math.abs(g.x+db.x-target.x)+Math.abs(g.y+db.y-target.y))})[0]}else choice=pool[Math.floor(Math.random()*pool.length)];move(g,choice);if(collision())break}}
if(power>0)power--;
}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){ctx.fillStyle='#100b26';ctx.fillRect(0,0,C.width,C.height);ctx.shadowBlur=0;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=map?.[y]?.[x]??raw[y][x];const px=x*T,py=y*T;if(c==='#'){ctx.fillStyle='#371455';ctx.fillRect(px+1,py+1,T-2,T-2);ctx.strokeStyle='#ff4cc6';ctx.lineWidth=1.6;ctx.shadowColor='#ff3cbb';ctx.shadowBlur=8;ctx.strokeRect(px+3,py+3,T-6,T-6);ctx.shadowBlur=0}else if(c==='.')circle(px+12,py+12,2.5,'#ffe5fa');else if(c==='o'){ctx.shadowColor='#ffdb54';ctx.shadowBlur=15;circle(px+12,py+12,6+Math.sin(performance.now()/180)*1.2,'#ffe36c');ctx.shadowBlur=0}}
if(player){const x=(player.x+.5)*T,y=(player.y+.5)*T;const angle=dirs[player.dir].a;const mouth=.15+Math.abs(Math.sin(performance.now()/115))*.38;ctx.fillStyle='#ff79c9';ctx.shadowColor='#ff4ac3';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,10.5,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath();ctx.fill();ctx.shadowBlur=0;circle(x+Math.cos(angle-Math.PI/2)*4,y+Math.sin(angle-Math.PI/2)*4,1.5,'#fff')}
for(const g of ghosts){const x=(g.x+.5)*T,y=(g.y+.5)*T;ctx.fillStyle=power&&Math.floor(performance.now()/160)%2===0?'#fff':power?'#447bff':g.color;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=13;ctx.beginPath();ctx.arc(x,y-2,9,Math.PI,0);ctx.lineTo(x+9,y+9);ctx.lineTo(x+5,y+6);ctx.lineTo(x+1,y+9);ctx.lineTo(x-3,y+6);ctx.lineTo(x-7,y+9);ctx.lineTo(x-9,y+6);ctx.closePath();ctx.fill();ctx.shadowBlur=0;circle(x-3,y-2,2.5,'#fff');circle(x+4,y-2,2.5,'#fff');circle(x-2,y-2,1,'#29214a');circle(x+5,y-2,1,'#29214a')}
if(!playing){ctx.fillStyle='#0b071fdc';ctx.fillRect(35,165,434,185);ctx.textAlign='center';ctx.shadowColor='#ff4bc4';ctx.shadowBlur=15;ctx.fillStyle='#ff75d4';ctx.font='bold 28px Courier New';ctx.fillText(over?'GAME OVER':won?'YOU WIN!':'PINK PIXEL MAZE',252,230);ctx.shadowBlur=0;ctx.font='bold 15px Courier New';ctx.fillStyle='#75fff0';ctx.fillText(over?'SCORE: '+score:'READY TO CHOMP?',252,270);ctx.font='13px Courier New';ctx.fillText('PRESS START OR ENTER',252,309)} }
function loop(t){const delta=Math.min(100,t-last||0);last=t;acc+=delta;while(acc>=115){step();acc-=115}draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key];if(k){e.preventDefault();desired=k}if(e.key==='Enter'&&!playing)start()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();desired=b.dataset.dir}));el('start').onclick=start;setHud();requestAnimationFrame(loop);
</script></body></html>
